name: MLXBits Image Studio
options:
  bundleIdPrefix: com.mlxbits
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# Debug/Release build the DMG app; the -AppStore pair builds the sandboxed App
# Store app from the same sources (docs/specs/2026-10-03-app-store-build-design.md).
configs:
  Debug: debug
  Release: release
  Debug-AppStore: debug
  Release-AppStore: release

configFiles:
  Debug-AppStore: Config/AppStore.xcconfig
  Release-AppStore: Config/AppStore.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.6.2"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    # Team only on Release so Debug builds stay unsigned/adhoc and don't
    # require a provisioning round-trip. CI archives Release (see
    # .github/workflows/release.yml), overriding DEVELOPMENT_TEAM at build time.
    # Replace XXXXXXXXXX with your Apple Developer Team ID (10-char string from
    # developer.apple.com → Membership). Only needed to build a signed release.
    Release:
      DEVELOPMENT_TEAM: XXXXXXXXXX

targets:
  MLXBits Image Studio:
    type: application
    platform: macOS
    # Explicit source dirs only — `path: .` swept build artifacts, tooling
    # configs (.swiftlint.yml/.periphery.yml/.jscpd.json), reports, logs, and
    # the built .app/.dmg into the app bundle (dotfile-blind `*.yml` excludes).
    # Info.plist is wired via the `info:` key. Entitlements are plain tracked files
    # chosen per configuration with CODE_SIGN_ENTITLEMENTS below: XcodeGen's
    # `entitlements:` key would override the App Store configurations' choice.
    sources:
      - App
      - Models
      - Runner
      - Stores
      - Utilities
      - path: Views
        excludes:
          - ".swiftlint.yml"
      - path: Resources/ideogram_caption_prompt.md
        buildPhase: resources
      - path: Resources/krea2_scenario_prompt_example.md
        buildPhase: resources
      - path: Resources/mflux_driver.py
        buildPhase: resources
      - path: Resources/run_tool.py
        buildPhase: resources
      - path: Resources/scenario_prompt.md
        buildPhase: resources
      - path: Resources/scenario_llm_driver.py
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: MLXBits Image Studio
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "© 2026 MLXBits"
        # Required for Mac App Store uploads; matches the App Store Connect category.
        LSApplicationCategoryType: public.app-category.graphics-design
        # Shown in macOS's local-network permission prompt.
        NSLocalNetworkUsageDescription: "Image Studio connects to LM Studio or ComfyUI on your local network when you set them up in Settings."
        # Only standard HTTPS: skips the export-compliance question on every
        # App Store Connect upload (ignored outside the store).
        ITSAppUsesNonExemptEncryption: false
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSSupportsAutomaticGraphicsSwitching: true
        # Allow cleartext HTTP to local LLM endpoints (LM Studio over LAN). macOS
        # auto-exempts localhost; NSAllowsLocalNetworking additionally exempts
        # unqualified hostnames, `.local` names, and reserved-range IPs
        # (192.168.x.x / 10.x.x.x). Note: `.lan` hostnames are NOT covered —
        # use the IP, a bare hostname, or a `.local` name.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    preBuildScripts:
      - name: SwiftFormat
        script: |
          SWIFTFORMAT=/opt/homebrew/bin/swiftformat
          if [ -f "$SWIFTFORMAT" ]; then
            "$SWIFTFORMAT" --config "${SRCROOT}/.swiftformat" "${SRCROOT}"
          else
            echo "warning: SwiftFormat not installed — run: brew install swiftformat"
          fi
        basedOnDependencyAnalysis: false
      - name: SwiftLint
        script: |
          SWIFTLINT=/opt/homebrew/bin/swiftlint
          if [ -f "$SWIFTLINT" ]; then
            "$SWIFTLINT" lint --config "${SRCROOT}/.swiftlint.yml"
          else
            echo "warning: SwiftLint not installed — run: brew install swiftlint"
          fi
        basedOnDependencyAnalysis: false
    # Runs after resources are copied and before Xcode signs the app, so the
    # runtime is sealed into the app's signature. No-op unless
    # BUNDLE_PYTHON_RUNTIME=YES.
    postBuildScripts:
      - name: Embed Python runtime
        script: |
          "${SRCROOT}/scripts/embed-python-runtime.sh"
        basedOnDependencyAnalysis: false
        # Lets Xcode's code-signing step notice when the runtime changed.
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/python/.embed-stamp
    settings:
      base:
        PRODUCT_NAME: "MLXBits Image Studio"
        PRODUCT_BUNDLE_IDENTIFIER: com.mlxbits.image-studio
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Resources/MLXBits_Image_Studio.entitlements
        # Read by scripts/embed-python-runtime.sh. Every configuration bundles
        # the runtime; CI's test and compile-only jobs pass NO to stay fast.
        BUNDLE_PYTHON_RUNTIME: YES
        PYTHON_RUNTIME_SANDBOXED: NO
        # The bundled runtime is arm64 only, and MLX needs Apple silicon.
        ARCHS: arm64
      configs:
        Debug-AppStore:
          PRODUCT_BUNDLE_IDENTIFIER: com.mlxbits.image-studio.appstore
          CODE_SIGN_ENTITLEMENTS: Resources/MLXBits_Image_Studio_AppStore.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE"
          PYTHON_RUNTIME_SANDBOXED: YES
          # A stable identity: ad-hoc signatures change every build, which
          # invalidates security-scoped bookmarks. Team from Config/Local.xcconfig.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Development
        Release-AppStore:
          PRODUCT_BUNDLE_IDENTIFIER: com.mlxbits.image-studio.appstore
          CODE_SIGN_ENTITLEMENTS: Resources/MLXBits_Image_Studio_AppStore.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE"
          PYTHON_RUNTIME_SANDBOXED: YES
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution

  MLXBits Image StudioTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: MLXBits Image Studio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mlxbits.image-studio.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MLXBits Image Studio:
    build:
      targets:
        MLXBits Image Studio: all
    test:
      targets:
        - MLXBits Image StudioTests
      gatherCoverageData: true
    run:
      config: Debug
  # The App Store flavor. Choosing this scheme is choosing the flavor; tests
  # run under the main scheme only.
  MLXBits Image Studio (App Store):
    build:
      targets:
        MLXBits Image Studio: all
    run:
      config: Debug-AppStore
    analyze:
      config: Debug-AppStore
    profile:
      config: Release-AppStore
    archive:
      config: Release-AppStore
